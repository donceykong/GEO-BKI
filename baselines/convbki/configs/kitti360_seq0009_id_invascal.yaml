# Conv-BKI eval config: KITTI-360 seq 0009, ID input, INVASCAL (lidarrv) preds.
#
# Mirror of kitti360_seq0000_id_invascal.yaml for seq 0009. ID = KITTI-360 scans
# through the KITTI-360-trained Invascal model (lidarrv_kitti360), raw KITTI-360
# hard labels collapsed via kitti360_to_common. Kernel = kitti360_9class_gt.
# Evaluated on all GT scans (13164, ungated).
#
# NOTE: seq0009 OOD (lidarrv_mcd) is NOT run — the lead's MCD-model generation
# for seq0009 is still in progress (0 files on disk).

experiment_name: kitti360_seq0009_id_invascal

dataset: kitti360
sequence_name: 2013_05_28_drive_0009_sync
data_root: null

input_data_suffix: velodyne_points/data
lidar_pose_suffix: velodyne_poses.txt
input_label_suffix: inferred_labels/lidarrv_kitti360/predicted_labels
gt_label_suffix: gt_labels

inferred_labels_key: kitti360
gt_labels_key: kitti360

calibration_file: ""

native_common: true
pred_format: hard_labels

staging_root: /home/sandilya/convbki_train_workspace/eval/kitti360_seq0009_id_invascal/staging
output_root: /home/sandilya/convbki_train_workspace/eval/kitti360_seq0009_id_invascal/nbki_runs
log_dir: baselines/convbki/logs

weights:
  path: baselines/convbki/Weights/kitti360_9class_gt/filters5.pt

grid:
  grid_size: [501, 501, 27]
  min_bound: [-50.1, -50.1, -2.7]
  max_bound: [50.1, 50.1, 2.7]

num_classes: 9
hard_input: true
filter_size: 5
kernel: sparse
per_class: true
compound: false
ell: 0.5
seed: 42
device: cuda
