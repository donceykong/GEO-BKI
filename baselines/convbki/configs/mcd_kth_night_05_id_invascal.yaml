# Conv-BKI eval config: MCD kth_night_05, ID input, INVASCAL (lidarrv) preds.
#
# Mirror of mcd_kth_day_09_id_invascal.yaml for kth_night_05. ID = MCD scans
# through the MCD-trained Invascal model (lidarrv_mcd), raw MCD hard labels
# collapsed via mcd_to_common. Kernel = mcd_9class_gt. Ungated (all GT scans).

experiment_name: mcd_kth_night_05_id_invascal

dataset: mcd
sequence_name: kth/kth_night_05
data_root: null

input_data_suffix: lidar_bin/data
lidar_pose_suffix: pose_inW.csv
input_label_suffix: inferred_labels/lidarrv_mcd/predicted_labels
gt_label_suffix: gt_labels_terrain

inferred_labels_key: mcd
gt_labels_key: mcd

calibration_file: ${OSM_BKI_DATA_ROOT}/mcd/kth/hhs_calib.yaml

native_common: true
pred_format: hard_labels

staging_root: /home/sandilya/convbki_train_workspace/eval/mcd_kth_night_05_id_invascal/staging
output_root: /home/sandilya/convbki_train_workspace/eval/mcd_kth_night_05_id_invascal/nbki_runs
log_dir: baselines/convbki/logs

weights:
  path: baselines/convbki/Weights/mcd_9class_gt/filters5.pt

grid:
  grid_size: [501, 501, 27]
  min_bound: [-50.1, -50.1, -2.7]
  max_bound: [50.1, 50.1, 2.7]

num_classes: 9
hard_input: true
filter_size: 5
kernel: sparse
per_class: true
compound: false
ell: 0.5
seed: 42
device: cuda
