# Conv-BKI eval config: MCD kth_day_09, OOD input, INVASCAL (lidarrv) preds.
#
# OOD = MCD (kth) scans through the KITTI-360-trained Invascal model
# (lidarrv_kitti360). Predictions are HARD uint32 RAW KITTI-360 labels;
# pred_format:hard_labels collapses raw->common via kitti360_to_common
# (inferred_labels_key: kitti360) — the cross-dataset input map — while GT stays
# MCD (gt_labels_key: mcd).
#
# Kernel: GT-retrained native-9-class MCD kernel (the eval dataset's kernel).
# See mcd_kth_day_09_id_invascal.yaml for the MCD path/calib notes. Ungated.

experiment_name: mcd_kth_day_09_ood_invascal

dataset: mcd
sequence_name: kth/kth_day_09
data_root: null

input_data_suffix: lidar_bin/data
lidar_pose_suffix: pose_inW.csv
input_label_suffix: inferred_labels/lidarrv_kitti360/predicted_labels
gt_label_suffix: gt_labels_terrain

inferred_labels_key: kitti360     # Invascal model trained on KITTI-360 taxonomy
gt_labels_key: mcd                # GT is MCD taxonomy

calibration_file: ${OSM_BKI_DATA_ROOT}/mcd/kth/hhs_calib.yaml

native_common: true
pred_format: hard_labels

staging_root: /home/sandilya/convbki_train_workspace/eval/mcd_kth_day_09_ood_invascal/staging
output_root: /home/sandilya/convbki_train_workspace/eval/mcd_kth_day_09_ood_invascal/nbki_runs
log_dir: baselines/convbki/logs

weights:
  path: baselines/convbki/Weights/mcd_9class_gt/filters5.pt

grid:
  grid_size: [501, 501, 27]
  min_bound: [-50.1, -50.1, -2.7]
  max_bound: [50.1, 50.1, 2.7]

num_classes: 9
hard_input: true
filter_size: 5
kernel: sparse
per_class: true
compound: false
ell: 0.5
seed: 42
device: cuda
