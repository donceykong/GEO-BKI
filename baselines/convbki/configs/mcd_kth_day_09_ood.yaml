# Conv-BKI experiment config: MCD kth_day_09, OOD CENet (cenet_kitti360_softmax).

experiment_name: mcd_kth_day_09_ood

dataset: mcd
sequence_name: kth_day_09
data_root: null

input_data_suffix: lidar_bin/data
lidar_pose_suffix: pose_inW.csv
input_label_suffix: inferred_labels/cenet_kitti360_softmax
gt_label_suffix: gt_labels_terrain

inferred_labels_key: kitti360
gt_labels_key: mcd

calibration_file: ${OSM_BKI_DATA_ROOT}/mcd/hhs_calib.yaml

staging_root: baselines/convbki/staging/mcd_kth_day_09_ood
output_root: baselines/convbki/nbki_runs/mcd_kth_day_09_ood
log_dir: baselines/convbki/logs

weights:
  dir: ConvBKI_PC_02_V
  epoch: 1

grid:
  grid_size: [1000, 1000, 27]
  min_bound: [-100.0, -100.0, -2.7]
  max_bound: [100.0, 100.0, 2.7]

num_classes: 20
filter_size: 5
kernel: sparse
per_class: true
compound: false
ell: 0.5
seed: 42
device: cuda
