# Conv-BKI eval config: KITTI-360 seq 0000, ID input, INVASCAL (lidarrv) preds.
#
# ID = KITTI-360 scans through the KITTI-360-trained Invascal model
# (inferred_labels/lidarrv_kitti360). Predictions are HARD uint32 RAW KITTI-360
# labels (one per point), NOT collapsed and NOT softmax. pred_format:hard_labels
# collapses raw->common via kitti360_to_common (inferred_labels_key: kitti360),
# the per-dataset labels-to-common pipeline the lead specified.
#
# Kernel: GT-retrained native-9-class KITTI-360 kernel (Weights/kitti360_9class_gt).
# Evaluated on all GT scans (S-BKI keyframe set absent -> ungated, same basis as
# the earlier CENet-based *_retrained runs).

experiment_name: kitti360_seq0000_id_invascal

dataset: kitti360
sequence_name: 2013_05_28_drive_0000_sync
data_root: null

input_data_suffix: velodyne_points/data
lidar_pose_suffix: velodyne_poses.txt
input_label_suffix: inferred_labels/lidarrv_kitti360/predicted_labels
gt_label_suffix: gt_labels

inferred_labels_key: kitti360
gt_labels_key: kitti360

calibration_file: ""

native_common: true
pred_format: hard_labels

staging_root: /home/sandilya/convbki_train_workspace/eval/kitti360_seq0000_id_invascal/staging
output_root: /home/sandilya/convbki_train_workspace/eval/kitti360_seq0000_id_invascal/nbki_runs
log_dir: baselines/convbki/logs

weights:
  path: baselines/convbki/Weights/kitti360_9class_gt/filters5.pt

grid:
  grid_size: [501, 501, 27]
  min_bound: [-50.1, -50.1, -2.7]
  max_bound: [50.1, 50.1, 2.7]

num_classes: 9
hard_input: true
filter_size: 5
kernel: sparse
per_class: true
compound: false
ell: 0.5
seed: 42
device: cuda
