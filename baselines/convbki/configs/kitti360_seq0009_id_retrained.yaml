# Conv-BKI eval config: KITTI-360 seq 0009, ID CENet, RETRAINED native-9-class.
#
# Mirror of kitti360_seq0000_id_retrained.yaml for sequence 0009. Evaluates the
# GT-retrained native-9-class kernel (baselines/convbki/Weights/kitti360_9class_gt)
# on seq 0009 ID input (cenet_kitti360_softmax -> kitti360_to_common).
#
#   - native_common: true  -> 9-class common space (0..8); convert maps identity.
#   - num_classes: 9, weights.path -> retrained final checkpoint (filters5.pt).
#   - Evaluated on all GT scans (13164) -- same all-GT-scan basis as seq 0000
#     retrained evals (S-BKI keyframe set absent on this machine).
#   - bulk artifacts (staging/output) under /home/sandilya (lead's machine rule).

experiment_name: kitti360_seq0009_id_retrained

dataset: kitti360
sequence_name: 2013_05_28_drive_0009_sync
data_root: null

input_data_suffix: velodyne_points/data
lidar_pose_suffix: velodyne_poses.txt
input_label_suffix: inferred_labels/cenet_kitti360_softmax
gt_label_suffix: gt_labels

inferred_labels_key: kitti360
gt_labels_key: kitti360

calibration_file: ""

native_common: true

staging_root: /home/sandilya/convbki_train_workspace/eval/kitti360_seq0009_id_retrained/staging
output_root: /home/sandilya/convbki_train_workspace/eval/kitti360_seq0009_id_retrained/nbki_runs
log_dir: baselines/convbki/logs

weights:
  path: baselines/convbki/Weights/kitti360_9class_gt/filters5.pt

grid:
  grid_size: [501, 501, 27]
  min_bound: [-50.1, -50.1, -2.7]
  max_bound: [50.1, 50.1, 2.7]

num_classes: 9
hard_input: true
filter_size: 5
kernel: sparse
per_class: true
compound: false
ell: 0.5
seed: 42
device: cuda
