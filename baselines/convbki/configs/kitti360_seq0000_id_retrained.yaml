# Conv-BKI eval config: KITTI-360 seq 0000, ID CENet, RETRAINED native-9-class.
#
# Counterpart to kitti360_seq0000_id.yaml (Option A, pretrained 20-class). This
# one evaluates the GT-retrained native-9-class kernel
# (baselines/convbki/Weights/kitti360_9class_gt) on seq 0000 ID input.
#
# Differences from Option A:
#   - native_common: true  -> staging writes labels + predictions_hard in the
#     9-class common space (0..8); convert_outputs maps pred->common as identity
#     (no SemKITTI 20-class projection).
#   - num_classes: 9
#   - weights.path -> the retrained final checkpoint (filters5.pt).
#   - bulk artifacts (staging/output) under /home/sandilya (lead's machine rule).

experiment_name: kitti360_seq0000_id_retrained

dataset: kitti360
sequence_name: 2013_05_28_drive_0000_sync
data_root: null

input_data_suffix: velodyne_points/data
lidar_pose_suffix: velodyne_poses.txt
input_label_suffix: inferred_labels/cenet_kitti360_softmax
gt_label_suffix: gt_labels

inferred_labels_key: kitti360
gt_labels_key: kitti360

calibration_file: ""

native_common: true

staging_root: /home/sandilya/convbki_train_workspace/eval/kitti360_seq0000_id_retrained/staging
output_root: /home/sandilya/convbki_train_workspace/eval/kitti360_seq0000_id_retrained/nbki_runs
log_dir: baselines/convbki/logs

weights:
  path: baselines/convbki/Weights/kitti360_9class_gt/filters5.pt

# Eval grid: ±50 m (501x501x27, 0.2 m voxel), same as Option A. The kernel was
# trained on the ±40 m grid but is voxel-size-native (0.2 m), so it transfers
# exactly.
grid:
  grid_size: [501, 501, 27]
  min_bound: [-50.1, -50.1, -2.7]
  max_bound: [50.1, 50.1, 2.7]

num_classes: 9
hard_input: true
filter_size: 5
kernel: sparse
per_class: true
compound: false
ell: 0.5
seed: 42
device: cuda
